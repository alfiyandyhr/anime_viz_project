<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Explore each year’s most popular anime and live-action movies and their highest-scoring matches."
  >

  <title>AnIViz — History</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../common/styles.css">
  <link rel="stylesheet" href="styles.css">

  <script src="../common/navigation.js" defer></script>
  <script src="../common/api.js" defer></script>
  <script src="../common/data-loader.js" defer></script>
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>

<body data-chapter="story">
  <a class="skip-story" href="#story-main">Skip to History</a>

  <div class="app-shell">
    <!-- Shared view navigation -->
    <header class="site-header">
      <a class="brand" href="../dust-magnet/index.html" aria-label="AnIViz home">AnIViz</a>
      <details class="view-menu" data-view-menu>
        <summary aria-controls="view-destinations">History</summary>
        <nav id="view-destinations" aria-label="Views">
          <a href="../dust-magnet/index.html">Dust &amp; Magnet</a>
          <a href="../story/index.html" aria-current="page">History</a>
          <a href="../network/index.html">Network</a>
          <a href="../explorer/index.html?mode=catalogue">Full Catalogue</a>
        </nav>
      </details>
    </header>

    <main class="stage history-stage" id="story-main" tabindex="-1">
      <div class="history-journey" id="history-journey">
        <div class="history-panel">
          <header class="history-header">
            <div>
              <p class="history-kicker">The AnIViz archive <span id="history-range"></span></p>
              <h1>Screen Echoes</h1>
              <p class="history-intro" id="history-intro">Scroll to explore each year’s most popular anime and its closest live-action movie matches.</p>
            </div>
            <div class="history-controls" id="history-controls" hidden>
              <fieldset class="history-perspective" aria-label="Timeline perspective">
                <label><input type="radio" name="history-perspective" value="anime" checked><span>Anime Timeline</span></label>
                <label><input type="radio" name="history-perspective" value="movie"><span>Movie Timeline</span></label>
              </fieldset>
              <div class="history-year-control">
                <label id="year-label" for="year-picker">Anime release year</label>
                <div class="history-year-buttons">
                  <button type="button" id="previous-year" aria-label="Previous year">←</button>
                  <select id="year-picker"></select>
                  <button type="button" id="next-year" aria-label="Next year">→</button>
                </div>
              </div>
              <div class="history-match-control">
                <label for="match-count">Connections</label>
                <select id="match-count">
                  <option value="1" selected>1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
            </div>
          </header>

          <div class="history-load" id="history-load" role="status" hidden>
            <span></span>
            <button type="button" id="retry-data" hidden>Retry</button>
          </div>
          <noscript><p>Enable JavaScript to explore the anime and movie timelines.</p></noscript>

          <section class="history-pair" id="history-pair" aria-label="Anime and movie matches" hidden>
            <article class="history-card history-anime" id="history-anime"></article>
            <figure class="history-visual">
              <svg id="history-timeline" role="img" aria-labelledby="timeline-title" viewBox="0 0 264 286">
                <title id="timeline-title">Anime and movie release timelines</title>
                <defs>
                  <linearGradient id="history-link-gradient" gradientUnits="userSpaceOnUse" x1="66" y1="0" x2="198" y2="0">
                    <stop stop-color="var(--left-track-color)"></stop>
                    <stop offset="1" stop-color="var(--right-track-color)"></stop>
                  </linearGradient>
                </defs>
                <g id="history-connection"></g>
                <path id="history-highlight-line" class="history-highlight-line" aria-hidden="true" hidden></path>
                <g id="anime-axis" class="history-track anime-track">
                  <text y="15" text-anchor="middle">ANIME</text>
                  <path class="history-axis"></path>
                  <g class="history-ticks" aria-hidden="true"></g>
                  <g id="anime-match-points"></g>
                  <circle id="anime-point" class="history-point" r="5"></circle>
                  <text id="anime-point-year" class="history-point-label"></text>
                </g>
                <g id="movie-axis" class="history-track movie-track">
                  <text y="15" text-anchor="middle">MOVIES</text>
                  <path class="history-axis"></path>
                  <g class="history-ticks" aria-hidden="true"></g>
                  <g id="movie-match-points"></g>
                  <circle id="movie-point" class="history-point" r="5"></circle>
                  <text id="movie-point-year" class="history-point-label"></text>
                </g>
              </svg>
              <figcaption class="history-score" id="history-score"></figcaption>
            </figure>
            <article class="history-card history-movie" id="history-movie"></article>
          </section>

          <footer class="history-note" id="history-note" hidden>
            <p id="history-method"></p>
            <p><span aria-hidden="true">↓</span> Scroll to explore by year</p>
          </footer>
        </div>
        <div id="history-travel" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <dialog class="history-dialog" id="history-dialog" aria-labelledby="synopsis-title">
    <form method="dialog"><button type="submit" autofocus>Close</button></form>
    <p class="history-kicker" id="synopsis-kind"></p>
    <h2 id="synopsis-title"></h2>
    <p id="synopsis-text"></p>
    <a id="synopsis-source" target="_blank" rel="noopener noreferrer"></a>
  </dialog>

  <template id="history-card-template">
    <div class="history-card-pages">
      <div class="history-card-face">
        <p class="history-card-label"><span class="history-card-kind"></span><span class="history-card-year"></span></p>
        <h2 tabindex="-1"></h2>
        <p class="history-card-meta"></p>
        <div class="history-card-summary">
          <img class="history-cover" alt="" hidden>
          <p></p>
        </div>
        <button type="button" class="synopsis-button" hidden>Read synopsis <span aria-hidden="true">↗</span></button>
      </div>
    </div>
    <ol class="history-extra-matches" aria-label="Other matches" hidden></ol>
  </template>
</body>
</html>
